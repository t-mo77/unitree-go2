# docker compose --profile fake up        : app (Web + brain) and the fake Go2
# docker compose run --rm --no-deps app <cmd> : run a command in /work (= this folder)
# docker compose --profile gazebo up gazebo : Go2 in Gazebo Harmonic (screen: http://localhost:6080/vnc.html)
#   the gazebo image is ROS 2 Jazzy (Ubuntu 24.04); app stays on Humble and talks to it over DDS
x-go2: &go2
  build:
    context: ./docker
    dockerfile: Dockerfile
  image: go2-voice-ltl:dev
  init: true
  volumes:
    - ./:/work
    # Only compose reads env.txt (env_file, on the host). Inside, /work/env.txt is empty, so
    # nothing in the container (an LLM CLI included) can read the token file.
    - /dev/null:/work/env.txt:ro
    - hf-cache:/root/.cache/huggingface
    - codex-home:/root/.codex
  env_file:
    - path: env.txt
      required: false

services:
  app:
    <<: *go2
    ports:
      # the page: http://localhost:8810 (GO2_UI_PORT=<port> docker compose ... to change it)
      - "127.0.0.1:${GO2_UI_PORT:-8810}:8000"
    environment:
      SIM: "1"
      GO2_UI_PORT: "${GO2_UI_PORT:-8810}"  # only for the page address in the log
      # what the page says it drives: fake (the fake Go2) or gazebo
      # (SIM_KIND=gazebo docker compose --profile gazebo up)
      SIM_KIND: "${SIM_KIND:-fake}"
      # seconds to wait for the Go2 at start-up; empty: 90 with SIM_KIND=gazebo, else 5
      GO2_WAIT_READY_S: "${GO2_WAIT_READY_S:-}"
    command: python3 -m voice_ltl.server

  sim:
    <<: *go2
    profiles: ["fake"]
    environment:
      # the fake Go2's objects: gazebo/layouts/<name>.json (default: box_1 and chair_1)
      GO2_LAYOUT: "${GO2_LAYOUT:-default}"
    command: python3 -m sim.fake_go2

  gazebo:
    # not built on the shared image: ROS 2 Jazzy + Gazebo Harmonic (arm64 has no Gazebo Classic)
    # no env_file and no login volumes: the simulator needs no LLM login
    profiles: ["gazebo"]
    build:
      context: ./docker
      dockerfile: Dockerfile.gazebo-fuel
    # go2-voice-ltl-gazebo:patch-0005 (patches 0001-0005, docker/patches) is built first with docker/Dockerfile.gazebo (docs/simulation.md); build here makes the thin image patch-0005-fuel1 on top of it (docker/Dockerfile.gazebo-fuel: the pinned Fuel models). The older images are kept on this Mac only:
    #   go2-voice-ltl-gazebo:patch-0004 (0001-0004: the gait phase still on the wall clock)
    #   go2-voice-ltl-gazebo:patch-0002 (0001-0002: the same image as the old :dev tag)
    # To go back to one:
    #   GO2_GAZEBO_IMAGE=go2-voice-ltl-gazebo:patch-0004 docker compose --profile gazebo up ...
    #   GO2_GAZEBO_IMAGE=go2-voice-ltl-gazebo:patch-0002 docker compose --profile gazebo up ...
    # It works only while that image exists locally; this tree cannot rebuild it. Never run
    # `build` (or `up` with the image missing) with GO2_GAZEBO_IMAGE set: compose would build
    # the thin Fuel image (Dockerfile.gazebo-fuel, on top of patch-0005) and put it under the given tag.
    image: ${GO2_GAZEBO_IMAGE:-go2-voice-ltl-gazebo:patch-0005-fuel1}
    init: true
    environment:
      # who publishes /go2/objects: logical (the bridge, from the logical camera) or detector (the detector
      # service: OBJECTS_SOURCE=detector SIM_KIND=gazebo docker compose --profile gazebo --profile detector up -d);
      # the bridge publishes the ground truth on /gazebo/objects_truth either way
      OBJECTS_SOURCE: "${OBJECTS_SOURCE:-logical}"
      # the objects the bridge spawns: gazebo/layouts/<name>.json
      GO2_LAYOUT: "${GO2_LAYOUT:-household}"
    volumes:
      - ./:/work
      - /dev/null:/work/env.txt:ro   # the simulator never needs the token file
    ports:
      # the Gazebo screen (GO2_GAZEBO_PORT=<port> docker compose ... to change it)
      - "127.0.0.1:${GO2_GAZEBO_PORT:-6080}:6080"
    # Go2 + unitree_guide controller + our bridge (gazebo/gazebo_bridge.py); LiDAR only, no rviz2
    command: ros2 launch /work/gazebo/launch/go2_gazebo.launch.py

volumes:
  hf-cache:
  codex-home:
