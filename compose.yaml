# docker compose --profile fake up        : app (Web + brain) and the fake Go2
# docker compose run --rm --no-deps app <cmd> : run a command in /work (= this folder)
# docker compose --profile gazebo up      : Go2 in Gazebo Harmonic (screen: http://localhost:6080/vnc.html)
#   the gazebo image is ROS 2 Jazzy (Ubuntu 24.04); app stays on Humble and talks to it over DDS
x-go2: &go2
  build:
    context: ./docker
    dockerfile: Dockerfile
  image: go2-voice-ltl:dev
  init: true
  volumes:
    - ./:/work
    - hf-cache:/root/.cache/huggingface
    - codex-home:/root/.codex
  env_file:
    - path: env.txt
      required: false

services:
  app:
    <<: *go2
    ports:
      # the page: http://localhost:8810 (GO2_UI_PORT=<port> docker compose ... to change it)
      - "127.0.0.1:${GO2_UI_PORT:-8810}:8000"
    environment:
      SIM: "1"
      GO2_UI_PORT: "${GO2_UI_PORT:-8810}"  # only for the page address in the log
    command: python3 -m voice_ltl.server

  sim:
    <<: *go2
    profiles: ["fake"]
    command: python3 -m sim.fake_go2

  gazebo:
    # not built on the shared image: ROS 2 Jazzy + Gazebo Harmonic (arm64 has no Gazebo Classic)
    # no env_file and no login volumes: the simulator needs no LLM login
    profiles: ["gazebo"]
    build:
      context: ./docker
      dockerfile: Dockerfile.gazebo
    image: go2-voice-ltl-gazebo:dev
    init: true
    volumes:
      - ./:/work
    ports:
      - "127.0.0.1:6080:6080"
    command: ros2 launch gz_quadruped_playground gazebo.launch.py pkg_description:=go2_description

volumes:
  hf-cache:
  codex-home:
