# docker compose --profile fake up        : app (Web + brain) and the fake Go2
# docker compose run --rm --no-deps app <cmd> : run a command in /work (= this folder)
# docker compose --profile gazebo up gazebo : Go2 in Gazebo Harmonic (screen: http://localhost:6080/vnc.html)
#   the gazebo image is ROS 2 Jazzy (Ubuntu 24.04); app stays on Humble and talks to it over DDS
x-go2: &go2
  build:
    context: ./docker
    dockerfile: Dockerfile
  image: go2-voice-ltl:dev
  init: true
  volumes:
    - ./:/work
    # Only compose reads env.txt (env_file, on the host). Inside, /work/env.txt is empty, so
    # nothing in the container (an LLM CLI included) can read the token file.
    - /dev/null:/work/env.txt:ro
    - hf-cache:/root/.cache/huggingface
    - codex-home:/root/.codex
  env_file:
    - path: env.txt
      required: false

services:
  app:
    <<: *go2
    ports:
      # the page: http://localhost:8810 (GO2_UI_PORT=<port> docker compose ... to change it)
      - "127.0.0.1:${GO2_UI_PORT:-8810}:8000"
    environment:
      SIM: "1"
      GO2_UI_PORT: "${GO2_UI_PORT:-8810}"  # only for the page address in the log
      # what the page says it drives: fake (the fake Go2) or gazebo
      # (SIM_KIND=gazebo docker compose --profile gazebo up)
      SIM_KIND: "${SIM_KIND:-fake}"
      # seconds to wait for the Go2 at start-up; empty: 90 with SIM_KIND=gazebo, else 5
      GO2_WAIT_READY_S: "${GO2_WAIT_READY_S:-}"
    command: python3 -m voice_ltl.server

  sim:
    <<: *go2
    profiles: ["fake"]
    command: python3 -m sim.fake_go2

  gazebo:
    # not built on the shared image: ROS 2 Jazzy + Gazebo Harmonic (arm64 has no Gazebo Classic)
    # no env_file and no login volumes: the simulator needs no LLM login
    profiles: ["gazebo"]
    build:
      context: ./docker
      dockerfile: Dockerfile.gazebo
    # patches 0001-0004 (docker/patches). The image before 0003-0004 (0001-0002) is kept on this Mac as
    # go2-voice-ltl-gazebo:patch-0002 (the same image as the old :dev tag). To go back to it:
    #   GO2_GAZEBO_IMAGE=go2-voice-ltl-gazebo:patch-0002 docker compose --profile gazebo up ...
    # It works only while that image exists locally; this tree cannot rebuild it. Never run
    # `build` (or `up` with the image missing) with GO2_GAZEBO_IMAGE set: compose would build
    # 0001-0004 from this tree and put that image under the given tag.
    image: ${GO2_GAZEBO_IMAGE:-go2-voice-ltl-gazebo:patch-0004}
    init: true
    volumes:
      - ./:/work
      - /dev/null:/work/env.txt:ro   # the simulator never needs the token file
    ports:
      - "127.0.0.1:6080:6080"
    # Go2 + unitree_guide controller + our bridge (gazebo/gazebo_bridge.py); LiDAR only, no rviz2
    command: ros2 launch /work/gazebo/launch/go2_gazebo.launch.py

volumes:
  hf-cache:
  codex-home:
