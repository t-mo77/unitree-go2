# docker compose --profile fake up        : app (Web + brain) and the fake Go2
# docker compose run --rm --no-deps app <cmd> : run a command in /work (= this folder)
# docker compose --profile gazebo up      : Go2 in Gazebo Classic (screen: http://localhost:6080/vnc.html)
#   build `app` first: the gazebo image is built FROM go2-voice-ltl:dev
x-go2: &go2
  build:
    context: ./docker
    dockerfile: Dockerfile
  image: go2-voice-ltl:dev
  init: true
  volumes:
    - ./:/work
    - hf-cache:/root/.cache/huggingface
    - codex-home:/root/.codex
  env_file:
    - path: env.txt
      required: false

services:
  app:
    <<: *go2
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      SIM: "1"
    command: python3 -m voice_ltl.server

  sim:
    <<: *go2
    profiles: ["fake"]
    command: python3 -m sim.fake_go2

  gazebo:
    <<: *go2
    profiles: ["gazebo"]
    build:
      context: ./docker
      dockerfile: Dockerfile.gazebo
    image: go2-voice-ltl-gazebo:dev
    env_file: []  # the simulator needs no LLM login
    ports:
      - "127.0.0.1:6080:6080"
    entrypoint: ["/usr/local/bin/gazebo_entry.sh"]
    command: ros2 launch unitree_guide_controller gazebo_classic.launch.py pkg_description:=go2_description

volumes:
  hf-cache:
  codex-home:
